name: Update and deploy

on:
  workflow_dispatch:
  schedule:
    # Beijing 07:20 primary, plus staggered 09:50, 12:40 and 17:20 backups.
    # GitHub may delay or skip scheduled runs; no cron time is guaranteed.
    - cron: "20 23 * * *"
    - cron: "50 1 * * *"
    - cron: "40 4 * * *"
    - cron: "20 9 * * *"
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-update-and-deploy
  cancel-in-progress: false

jobs:
  update-and-build:
    name: Fetch, verify and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt
          pip install --no-deps -e .

      - name: Quality checks
        run: |
          ruff check .
          mypy src
          pytest -q

      - name: Build offline demo for pushes
        if: github.event_name == 'push'
        run: python -m theory_daily.cli demo --fixtures

      - name: Validate offline demo for pushes
        if: github.event_name == 'push'
        run: python -m theory_daily.cli validate

      - name: Build publishable history for pushes
        if: github.event_name == 'push'
        run: python -m theory_daily.cli build

      - name: Run official daily update
        env:
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'openai' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.6-luna' }}
          OPENAI_REASONING_EFFORT: low
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL || 'deepseek-v4-flash' }}
          DEEPSEEK_BASE_URL: https://api.deepseek.com
          MAX_LLM_PAPERS_PER_RUN: "60"
        run: python -m theory_daily.cli update --since-days 7

      - name: Validate static output
        run: python -m theory_daily.cli validate

      - name: Persist official data history
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Preserve curated papers, reusable LLM decisions and audit reports.
          # Large raw fetch snapshots and rejected intermediate results are
          # ephemeral, not new Git history on every scheduled run.
          git add -A -- data/papers data/cache/llm data/review_queue data/state.json data/reports/*.json
          git add -u -- data/raw data/normalized data/rejected
          if ! git diff --cached --quiet; then
            git commit -m "chore(data): daily update $(date -u +%F) [skip ci]"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist


      - name: Write run summary
        if: always()
        shell: bash
        run: |
          echo "## Black Hole Theory Daily" >> "$GITHUB_STEP_SUMMARY"
          REPORT=$(find data/reports -name '*.json' -type f | sort | tail -1)
          if [ -n "$REPORT" ]; then
            python -c "import json,sys; d=json.load(open(sys.argv[1],encoding='utf-8')); print('\\n'.join(f'- {k}: {d.get(k)}' for k in ('status','fetched_arxiv','fetched_inspire','deduplicated','candidates','pending_candidates','new_selected','selected','review_queue','rejected')))" "$REPORT" >> "$GITHUB_STEP_SUMMARY"
          fi

  # Isolate deployments from the uploader. Re-running only a failed deploy
  # must not create a second artifact with the same github-pages name.
  deploy:
    name: Publish GitHub Pages
    needs: update-and-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry_1.outputs.page_url || steps.deployment_retry_2.outputs.page_url || steps.deployment_retry_3.outputs.page_url }}
    steps:
      # GitHub Pages artifact lookups can temporarily return no matches
      # even after upload-pages-artifact reports success. Retry only deploy.
      - name: Deploy GitHub Pages (attempt 1)
        id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - name: Pause before deploy retry 1
        if: ${{ steps.deployment.outcome == 'failure' }}
        run: sleep 5

      - name: Deploy GitHub Pages (attempt 2)
        id: deployment_retry_1
        if: ${{ steps.deployment.outcome == 'failure' }}
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - name: Pause before deploy retry 2
        if: ${{ steps.deployment_retry_1.outcome == 'failure' }}
        run: sleep 20

      - name: Deploy GitHub Pages (attempt 3)
        id: deployment_retry_2
        if: ${{ steps.deployment_retry_1.outcome == 'failure' }}
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - name: Pause before deploy retry 3
        if: ${{ steps.deployment_retry_2.outcome == 'failure' }}
        run: sleep 60

      # Final attempt is NOT masked: persistent failures remain visible in CI.
      - name: Deploy GitHub Pages (final attempt)
        id: deployment_retry_3
        if: ${{ steps.deployment_retry_2.outcome == 'failure' }}
        uses: actions/deploy-pages@v5
      - name: Verify live site, feed and fresh data
        env:
          SITE_URL: https://lts2590871238-cpu.github.io/black-hole-theory-daily-new/
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.request
          from datetime import datetime, timezone

          site = os.environ['SITE_URL']
          for attempt in range(1, 9):
              try:
                  def get(path):
                      request = urllib.request.Request(
                          site + path, headers={'User-Agent': 'TheoryDaily-CI-Health/1.0'}
                      )
                      with urllib.request.urlopen(request, timeout=20) as response:
                          if response.status != 200:
                              raise RuntimeError(f'{path}: HTTP {response.status}')
                          return response.read()

                  homepage = get('index.html').decode('utf-8')
                  if '黑洞与引力理论每日精选' not in homepage:
                      raise RuntimeError('homepage title missing')
                  papers = json.loads(get('papers.json'))
                  if not papers.get('papers') or not papers.get('schema_version'):
                      raise RuntimeError('published papers missing or invalid')
                  timestamp = datetime.fromisoformat(
                      papers['generated_at'].replace('Z', '+00:00')
                  )
                  age = (datetime.now(timezone.utc) - timestamp).total_seconds()
                  if not -300 <= age <= 10800:
                      raise RuntimeError(f'published data is stale: age={age:.0f}s')
                  feed = get('feed.xml').decode('utf-8')
                  if site.rstrip('/') + '/feed.xml' not in feed:
                      raise RuntimeError('Atom feed link points at the wrong site')
                  print(f'Live Pages health check passed on attempt {attempt}')
                  break
              except (OSError, KeyError, ValueError, RuntimeError) as exc:
                  if attempt == 8:
                      raise RuntimeError(f'Published website validation failed: {exc}') from exc
                  print(f'Site not ready (attempt {attempt}/8): {exc}')
                  time.sleep(10)
          PY
